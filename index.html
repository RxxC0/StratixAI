<!-- ONBOARDING STRATIX : à coller dans index.html, juste avant </body>, après le <script> existant -->
<style>
#ob{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto}#ob.on{display:block}
.ob{max-width:620px;margin:auto;padding:16px;min-height:100vh;display:flex;flex-direction:column}
.obp{height:4px;background:#28313C;border-radius:4px;margin:8px 0 16px;overflow:hidden}.obp i{display:block;height:100%;background:var(--orange);transition:width .3s}
.obs{flex:1;display:flex;flex-direction:column;gap:16px;animation:in .25s}.obs h2{font-size:32px;margin:0;line-height:1.05}.obs p{margin:0}
.opt{background:var(--panel);color:var(--txt);border:2px solid #293440;border-radius:12px;padding:16px;font:700 20px Rajdhani,sans-serif;text-align:left;cursor:pointer;transition:.13s;width:100%}
.opt:active{transform:scale(.98);filter:brightness(1.2)}.opt.sel{border-color:var(--orange);background:#2A1A12}
.btn:disabled{background:#2A333D;color:#6B7785;cursor:not-allowed;transform:none;filter:none}
.obf{padding-top:16px;display:grid;gap:16px}.obf:empty{display:none}
.hold{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:#ffffff40}.hold span{position:relative}
.blur{filter:blur(7px);user-select:none;pointer-events:none}.bar{height:7px;border-radius:8px;background:#303945;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--orange);transition:width .9s}
.tags{display:flex;flex-wrap:wrap;gap:8px}.st{color:#6B7785;transition:.3s}.st.on{color:var(--txt)}.st.on b{color:var(--orange)}
</style>
<div id="ob" role="dialog" aria-label="Onboarding Stratix"></div>
<script>
(()=>{
const R=['Cuivre/Bronze','Argent','Or','Platine','Émeraude','Diamant','Champion'],N=17,root=document.getElementById('ob'),
e=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let i=0,A={},P=null,busy=false;
const C=(t,o,key,sub,multi)=>({c:1,t,o,key,sub,multi});
const steps=[
{r:promise},
C('Tu joues surtout comment ?',['Ranked','Unranked','Partie en équipe','Scrims'],'mode','Ça sert à calibrer ton analyse'),
C('Ton rang actuel ?',R,'rank'),
C('Tu joues plutôt à l’attaque ou en défense ?',['Attaque','Défense','Les deux'],'side'),
C('Ton rôle préféré ?',['Entry','Support','Anti-entry','Flex','Je ne sais pas'],'role'),
C('Où as-tu connu Stratix ?',['TikTok','Instagram','YouTube','Un ami','Autre'],'src'),
C('Tu as déjà essayé de progresser avec autre chose ?',['Des replays','Des vidéos YouTube','Un coach','Rien pour l’instant'],'tried'),
{r:(o,f)=>{o.innerHTML='<p class="eyebrow">STRATIX</p><h2>Revoir ses replays prend des heures, et on ne voit pas toujours ce qui cloche.</h2><p class="muted" style="font-size:22px">Stratix te donne un diagnostic en quelques secondes, à partir de ton récit du match.</p>';nx(f)}},
{r:analyse},
C('Qu’est-ce qui te fait perdre le plus de rounds ?',['Je meurs en premier','Je rate mes duels','Je communique mal','Je prends de mauvaises décisions','Je ne sais pas'],'pains','Plusieurs réponses possibles',1),
{r:goal},
C('Qu’est-ce qui te motive à progresser ?',['Monter de rang','Jouer avec ma team','Être le meilleur de mes potes','Entrer en compétition'],'mot'),
{r:(o,f)=>{o.innerHTML='<p class="eyebrow">NOTRE ENGAGEMENT</p><div class="panel"><p style="font-size:26px;font-weight:700">« Stratix analyse uniquement ce que tu racontes, sans inventer de statistiques. »</p><p class="muted" style="margin-top:12px">— Le fondateur de Stratix</p></div><p class="muted">Confidentialité : tes réponses restent sur cet appareil tant que tu n’as pas de compte. Le récit de ton match est envoyé à notre moteur d’analyse (OpenAI) uniquement pour produire ta carte.</p>';nx(f)}},
{r:commit},{r:build},{r:result},{r:login},{r:result}];
function btn(t,fn,dis){const b=document.createElement('button');b.className='btn';b.textContent=t;b.disabled=!!dis;if(fn)b.onclick=fn;return b}
function nx(f,t='Continuer'){f.append(btn(t,()=>go(i+1)))}
function go(n){i=n;draw()}
function draw(){const s=steps[i];root.innerHTML='<div class="ob"><div class="obp"><i style="width:'+Math.round(i/(N)*100)+'%"></i></div><div class="obs"></div><div class="obf"></div></div>';root.scrollTop=0;const o=root.querySelector('.obs'),f=root.querySelector('.obf');s.c?choice(s,o,f):s.r(o,f,i===17)}
function choice(s,o,f){const m=s.multi,get=()=>A[s.key];o.innerHTML='<h2>'+s.t+'</h2>'+(s.sub?'<p class="muted">'+s.sub+'</p>':'')+s.o.map((x,n)=>'<button class="opt" data-n="'+n+'">'+x+'</button>').join('');
const b=btn('Continuer',()=>go(i+1),!get()||(m&&!get().length));f.append(b);
const mark=()=>o.querySelectorAll('.opt').forEach((x,n)=>x.classList.toggle('sel',m?(get()||[]).includes(s.o[n]):get()===s.o[n]));mark();
o.querySelectorAll('.opt').forEach((x,n)=>x.onclick=()=>{const v=s.o[n];if(m){let a=A[s.key]||[];a=a.includes(v)?a.filter(y=>y!==v):[...a,v];A[s.key]=a}else A[s.key]=v;mark();b.disabled=m?!A[s.key].length:false})}
function promise(o,f){o.innerHTML='<div class="eyebrow">STRATIX</div><h2 style="font-size:40px">Découvre ce qui te fait perdre tes rounds</h2><div class="panel scoreCard"><div class="top"><div class="brand" style="font-size:20px">STRAT<span class="orange">IX</span></div><span class="eyebrow">EXEMPLE</span></div><div class="score" id="pc">0</div><span class="muted">NOTE GLOBALE / 100</span>'+['Positionnement','Duels','Communication','Décisions'].map(x=>'<div class="metric"><span>'+x+'</span><div class="track"><div class="fill" style="width:0;transition:width 1s"></div></div></div>').join('')+'</div><p class="tiny">Aperçu illustré de ta future carte de joueur.</p>';nx(f,'Continuer');
let n=0;const el=o.querySelector('#pc'),t=setInterval(()=>{if(!el.isConnected||n>=100){clearInterval(t);return}n+=2;el.textContent=n},30);
o.querySelectorAll('.fill').forEach((x,k)=>setTimeout(()=>{if(x.isConnected)x.style.width=[70,55,80,62][k]+'%'},300+k*350))}
function ok(p){return p&&Number.isInteger(p.score)&&p.score>=0&&p.score<=100&&p.metrics&&['positionnement','duels','communication','decisions'].every(k=>Number.isInteger(p.metrics[k]))&&p.verdict&&p.summary&&Array.isArray(p.strengths)&&Array.isArray(p.weaknesses)&&p.weaknesses.length>0&&p.training}
function analyse(o,f){const mp=document.getElementById('map').innerHTML,v=A.form||{};
o.innerHTML='<h2>Ta première analyse</h2><p class="muted">Raconte un match récent. Sois précis.</p><div class="field"><label>Carte</label><select id="om">'+mp+'</select></div><div class="field"><label>Côté</label><select id="os"><option value="">Choisir</option><option>Attaque</option><option>Défense</option></select></div><div class="field"><label>Résultat</label><select id="or"><option value="">Choisir</option><option>Victoire</option><option>Défaite</option></select></div><div class="field"><label>Raconte ce qui s’est passé</label><textarea id="ot" maxlength="2500" style="min-height:80px" placeholder="Ex. : je meurs souvent en premier à l’entrée, sans drone…"></textarea></div><div id="oe" class="error" role="alert"></div>';
om.value=v.map||'';os.value=v.side||'';or.value=v.out||'';ot.value=v.story||'';
const b=btn('Analyser mon match ↗',async()=>{if(busy)return;const m={map:om.value,side:os.value,outcome:or.value,story:ot.value.trim()};A.form={map:m.map,side:m.side,out:m.outcome,story:m.story};const er=document.getElementById('oe');er.style.display='none';
if(!m.map||!m.side||!m.outcome||m.story.length<15){er.textContent='Renseigne la carte, le côté, le résultat et raconte ton match (au moins une phrase).';er.style.display='block';return}
busy=true;m.operator=A.role&&A.role!=='Je ne sais pas'?A.role:'Non précisé';
o.innerHTML='<div class="brand">STRAT<span class="orange">IX</span></div><div class="panel loading"><div class="sweep"></div><div class="eyebrow">ANALYSE TACTIQUE EN COURS</div><div class="stage">01 · POSITIONNEMENT</div><div class="stage">02 · DUELS</div><div class="stage">03 · DÉCISIONS</div><span class="muted">LECTURE DE TON MATCH…</span></div>';f.innerHTML='';
try{const t0=performance.now(),ct=new AbortController(),tm=setTimeout(()=>ct.abort(),15000);let res;try{res=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({match:m}),signal:ct.signal})}finally{clearTimeout(tm)}
const p=await res.json().catch(()=>({}));if(!res.ok)throw Error(p.error||'Le moteur d’analyse est indisponible.');if(!ok(p))throw Error('Donne-moi plus de détails sur ton match pour que je puisse t’analyser.');
await sleep(Math.max(0,2500-(performance.now()-t0)));P=p;busy=false;try{localStorage.setItem('stratix_ob',JSON.stringify({A,P}))}catch(_){}
o.innerHTML='<p class="eyebrow">APERÇU DE TON ANALYSE</p><div class="panel scoreCard"><div class="score">'+p.score+'</div><span class="muted">NOTE GLOBALE / 100</span><div class="divider"></div><div class="eyebrow" style="color:#EF7777">UN POINT FAIBLE</div><div class="point bad">'+e(p.weaknesses[0])+'</div></div><p class="muted">Le reste (sous-notes, points forts, autres axes, mission) est débloqué dans ta carte complète.</p>';nx(f)}
catch(x){busy=false;draw();const er=document.getElementById('oe');er.textContent=x.name==='AbortError'?'L’analyse prend trop de temps. Réessaie.':(x.message||'Erreur de connexion au moteur d’analyse.');er.style.display='block'}});f.append(b)}
function goal(o,f){const idx=R.indexOf(A.rank),g=idx>=0&&idx<6?R.slice(idx+1):['Rester Champion'],W=['1 à 3','4 à 7','8 et plus'],M={'1 à 3':'4 à 12 fois','4 à 7':'16 à 28 fois','8 et plus':'32 fois ou plus'};
o.innerHTML='<h2>Quel rang veux-tu atteindre ?</h2>'+g.map(x=>'<button class="opt" data-g="'+x+'">'+x+'</button>').join('')+'<h2 style="font-size:26px;margin-top:8px">Combien de matchs analyses-tu par semaine ?</h2><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">'+W.map(x=>'<button class="opt" style="text-align:center;padding:14px 4px" data-w="'+x+'">'+x+'</button>').join('')+'</div><div class="panel" id="pj" style="display:none"></div>';
const b=btn('Continuer',()=>go(i+1),true),up=()=>{o.querySelectorAll('[data-g]').forEach(x=>x.classList.toggle('sel',x.dataset.g===A.goal));o.querySelectorAll('[data-w]').forEach(x=>x.classList.toggle('sel',x.dataset.w===A.week));const p=document.getElementById('pj');if(A.week){p.style.display='block';p.innerHTML='Avec <b class="orange">'+A.week+'</b> analyses par semaine, tu travailles tes points faibles <b class="orange">'+M[A.week]+'</b> par mois.<div class="tiny" style="margin-top:6px">Calcul simple sur 4 semaines. Aucune promesse de rang ni de date.</div>'}b.disabled=!(A.goal&&A.week)};
o.querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>{A.goal=x.dataset.g;up()});o.querySelectorAll('[data-w]').forEach(x=>x.onclick=()=>{A.week=x.dataset.w;up()});if(!g.includes(A.goal))A.goal=null;f.append(b);up()}
function commit(o,f){o.innerHTML='<h2>Ton engagement</h2><div class="panel"><p style="font-size:24px;font-weight:700">Je m’engage à analyser mes matchs pour progresser</p></div><p class="muted">Maintiens le bouton appuyé 2 secondes.</p>';
const b=document.createElement('button');b.className='btn hold';b.innerHTML='<i></i><span>Maintenir pour m’engager</span>';const bar=b.firstChild;let t=null,done=false;
const on=()=>{if(t||done)return;bar.style.transition='width 2s linear';bar.style.width='100%';t=setTimeout(()=>{done=true;go(i+1)},2000)},off=()=>{if(done)return;clearTimeout(t);t=null;bar.style.transition='width .2s';bar.style.width='0'};
b.onpointerdown=on;b.onpointerup=b.onpointerleave=b.onpointercancel=off;b.onkeydown=x=>{if(x.key===' '||x.key==='Enter'){x.preventDefault();if(!x.repeat)on()}};b.onkeyup=off;b.oncontextmenu=x=>x.preventDefault();f.append(b)}
async function build(o,f){const L=['Lecture de ton profil','Analyse de tes points faibles','Préparation de ton plan d’entraînement'];
o.innerHTML='<h2>Construction de ta carte</h2><div class="score" id="bp">0%</div><div class="bar"><i id="bb" style="transition:width .1s"></i></div>'+L.map(x=>'<div class="st"><b>●</b> '+x+'</div>').join('');
const st=o.querySelectorAll('.st');for(let n=0;n<=100;n++){if(!o.isConnected||i!==14)return;document.getElementById('bp').textContent=n+'%';document.getElementById('bb').style.width=n+'%';st.forEach((x,k)=>x.classList.toggle('on',n>=k*34));await sleep(45)}
await sleep(400);if(i===14)go(15)}
function result(o,f,fin){if(!P){o.innerHTML='<div class="error" style="display:block">Ta carte n’est pas disponible. Relance l’analyse.</div>';f.append(btn('Refaire l’analyse',()=>go(8)));return}
const p=P,me=[['positionnement','Positionnement'],['duels','Duels'],['communication','Communication'],['decisions','Décisions']];
o.innerHTML='<div class="panel scoreCard"><div class="top"><div class="brand" style="font-size:20px">STRAT<span class="orange">IX</span></div><span class="eyebrow">PLAYER REPORT</span></div><p class="eyebrow">'+e(A.rank||'')+' · '+e(A.role||'')+' · '+e(A.mode||'')+'</p><div class="score">'+p.score+'</div><span class="muted">NOTE GLOBALE / 100</span><h2 style="margin:8px 0">'+e(p.verdict)+'</h2><div class="eyebrow" style="margin-top:12px">CE QUI TE FAIT PERDRE DES ROUNDS</div><div class="tags" style="margin-top:8px">'+(A.pains||[]).map(x=>'<span class="tag">'+e(x)+'</span>').join('')+'</div><div class="divider"></div><div class="blur" aria-hidden="true"><div class="eyebrow">COMPÉTENCES</div>'+me.map(([k,n])=>'<div class="metric"><span>'+n+'</span><b>'+p.metrics[k]+'/100</b><div class="track"><div class="fill" style="width:'+p.metrics[k]+'%"></div></div></div>').join('')+'<div class="eyebrow" style="color:#36C98B">POINTS FORTS</div>'+p.strengths.map(x=>'<div class="point good">'+e(x)+'</div>').join('')+'<div class="eyebrow" style="color:#EF7777">AXES DE PROGRESSION</div>'+p.weaknesses.map(x=>'<div class="point bad">'+e(x)+'</div>').join('')+'<div class="eyebrow">MISSION · PROCHAIN MATCH</div><div class="point">'+e(p.training)+'</div></div></div><p class="tiny">Évaluation fondée uniquement sur ce que tu as raconté.</p>';
if(fin)f.append(btn('Débloquer'));else f.append(btn('Sauvegarder ma carte',()=>go(16)))}
function login(o,f){o.innerHTML='<h2>Sauvegarde ta carte de joueur</h2><p class="muted">Tes réponses et ta carte restent liées à ton compte.</p><button class="opt" data-p="Google">Continuer avec Google</button><button class="opt" data-p="Apple">Continuer avec Apple</button><div id="le" class="error" role="alert"></div>';
o.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{const cfg=(window.STRATIX_AUTH||{})[x.dataset.p.toLowerCase()];const er=document.getElementById('le');if(typeof cfg==='function'){cfg(A,P).then(()=>go(17)).catch(()=>{er.textContent='La connexion a échoué. Réessaie.';er.style.display='block'})}else{er.textContent='La connexion '+x.dataset.p+' n’est pas encore activée sur Stratix. Tes réponses et ta carte restent sur cet appareil.';er.style.display='block'}});
f.append(btn('Plus tard',()=>go(17)));f.firstChild.classList.add('secondary')}
document.getElementById('start').onclick=()=>{A={};P=null;busy=false;root.classList.add('on');go(0)};
})();
</script>
